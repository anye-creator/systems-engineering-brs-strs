name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - 'parts/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble index.html from encoded parts
        run: |
          set -e
          if [ ! -f parts/a.b64 ] || [ ! -f parts/b.b64 ]; then
            echo "parts incomplete; skipping"
            exit 0
          fi
          cat parts/a.b64 parts/b.b64 | tr -d ' \n\r' > /tmp/page.b64
          base64 -d /tmp/page.b64 > /tmp/page.gz
          gunzip -c /tmp/page.gz > index.html
          echo "404aa23fc225c7820d47783c51f4ba495f283de76e901a34c3e99f4e2ff24fb5  index.html" | sha256sum -c -
          ls -l index.html

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: assemble index.html from parts"
            git push
          fi

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
