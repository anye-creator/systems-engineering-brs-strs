name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_URL: 'https://aka.doubaocdn.com/s/FCwhDANtb3'
  EXPECTED_SHA: '404aa23fc225c7820d47783c51f4ba495f283de76e901a34c3e99f4e2ff24fb5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch index.html
        run: |
          set -e
          if [ -f index.html ] && [ "$(sha256sum index.html | cut -d' ' -f1)" = "$EXPECTED_SHA" ]; then
            echo "index.html already present and verified"
            exit 0
          fi
          curl -fsSL --retry 3 --max-time 90 "$SOURCE_URL" -o index.html
          echo "$EXPECTED_SHA  index.html" | sha256sum -c -

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: add index.html (sha256 verified)"
            git push
          else
            echo "nothing to commit"
          fi

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
